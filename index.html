<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Girlfriend's Day ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.button{
    width:220px;
    height:220px;
    border-radius:50%;
    background:#ff0066;
    color:white;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-size:30px;
    font-weight:bold;
    box-shadow:
        0 0 20px #ff0066,
        0 0 40px #ff0066,
        0 0 80px #ff0066;
    transition:.3s;
    animation:pulse 1.5s infinite;
}

.button:hover{
    transform:scale(1.1);
    box-shadow:
        0 0 30px #ff3399,
        0 0 60px #ff3399,
        0 0 120px #ff3399;
}

@keyframes pulse{
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.08);
    }
    100%{
        transform:scale(1);
    }
}
</style>

</head>

<body>

<a class="button" href="YOUR_VIDEO_LINK_HERE" target="_blank">
CLICK<br>ME ❤️
</a>

</body>
</html>
