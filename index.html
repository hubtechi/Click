<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Girlfriend's Day ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:1000px;
    text-align:center;
}

h1{
    color:#ff4d94;
    margin-bottom:10px;
}

p{
    color:#ccc;
    margin-bottom:30px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
}

.video-card{
    background:#111;
    border:2px solid #ff0066;
    border-radius:20px;
    text-decoration:none;
    color:white;
    padding:40px 20px;
    font-size:22px;
    font-weight:bold;
    transition:.3s;
    box-shadow:0 0 20px #ff0066;
}

.video-card:hover{
    transform:translateY(-10px) scale(1.05);
    background:#ff0066;
    box-shadow:0 0 35px #ff3399;
    }
.button{
    width:220px;
    height:220px;
    border-radius:50%;
    background:#ff0066;
    color:white;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-size:30px;
    font-weight:bold;
    box-shadow:
        0 0 20px #ff0066,
        0 0 40px #ff0066,
        0 0 80px #ff0066;
    transition:.3s;
    animation:pulse 1.5s infinite;
}

.button:hover{
    transform:scale(1.1);
    box-shadow:
        0 0 30px #ff3399,
        0 0 60px #ff3399,
        0 0 120px #ff3399;
}

@keyframes pulse{
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.08);
    }
    100%{
        transform:scale(1);
    }
}
</style>

</head>

<body>

<div class="container">

<h1>❤️ Happy Girlfriend's Day ❤️</h1>
<p>Choose a memory to watch</p>

<div class="gallery">

<a class="video-card" href="family.mp4" target="_blank">
🎥<br>
Family Memories
</a>

<a class="video-card" href="date.mp4" target="_blank">
💕<br>
Our Date
</a>

<a class="video-card" href="funny.mp4" target="_blank">
😂<br>
Funny Moments
</a>

<a class="video-card" href="love.mp4" target="_blank">
❤️<br>
Love Video
</a>

<a class="video-card" href="surprise.mp4" target="_blank">
🎁<br>
Special Surprise
</a>

<a class="video-card" href="future.mp4" target="_blank">
✨<br>
Our Future
</a>

</div>

</div>

</body>
</html>
